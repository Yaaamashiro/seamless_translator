[project]
name = "speech-translator-demo"
version = "0.1.0"
description = "Windows native two-way speech translation demo"
readme = "README.md"
authors = [
    { name = "Yaaamashiro", email = "yaaamashiro@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "huggingface-hub>=0.36,<1",
    "numpy>=2.5.3",
    "piper-tts>=1.3",
    "pyopenjtalk-plus>=0.4.1.post9",
    "pyside6>=6.11.2",
    "pyyaml>=6.0.3",
    "sacremoses>=0.2.0",
    "scipy>=1.18.1",
    "sentencepiece>=0.2.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.6",
    "transformers>=4.48,<5",
]

[project.scripts]
speech-translator = "speech_translator.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "speech_translator"
